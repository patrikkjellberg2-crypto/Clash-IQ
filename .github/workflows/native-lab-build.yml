name: Native Lab Android Build

on:
  push:
    branches:
      - clash-iq-native-lab
    paths:
      - 'native-lab/**'
      - '.github/workflows/native-lab-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-iq-native-lab-debug
          path: native-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
